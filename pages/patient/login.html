<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/logos/medibook-logo-transparent.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/patient.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
    <title>MediBook | Login</title>
</head>

<body class="page-gradient">
    <div id="navbar-placeholder"></div>

    <div class="breadcrumb-wrapper">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <small class="text-muted breadcrumbs">
                        <a href="/index.html">Home</a>
                        <span>></span>
                        <a href="signup.html">Create Account</a>
                        <span>></span>
                        <a href="booking.html">Booking</a>
                        <span>></span>
                        <a href="Reschedule_Appointment.html">Schedule Appointment</a>
                        <span>></span>
                        <a href="appointments.html">My Appointments</a>
                        <span>></span>
                        <a href="appointment_details.html">Appointment Details</a>
                    </small>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5 login-section">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center main-title mb-4">Log In</h1>

                <div class="row justify-content-center">
                    <div class="col-md-10 col-lg-8">
                        <div class="card login-card p-4">
                            <div class="alert alert-light d-flex align-items-center gap-2">
                                <i class="bi bi-envelope-fill text-primary fs-4"></i>
                                <span>We'll send you an email confirmation with your appointment details.</span>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" placeholder="Enter your email address" />
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text">+20</span>
                                    <input type="text" class="form-control" placeholder="Enter your phone number" />
                                </div>
                            </div>

                            <button class="btn btn-main w-100 text-white mb-3">Login</button>

                            <div class="text-center text-muted mb-3">or</div>

                            <a href="signup.html" class="btn btn-outline-primary w-100">Create an Account</a>

                            <p class="text-center text-muted mt-2 small">
                                You can create an account later to manage your appointments easily.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/load-partials.js"></script>
</body>

</html>
