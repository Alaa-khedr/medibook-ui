<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBook | Logout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary-custom" href="dashboard.html">
                <i class="fa-solid fa-book-medical fa-lg"></i> MediBook
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-3">
                    <li class="nav-item">
                        <a href="#" class="nav-link p-0">
                            <img src="https://ui-avatars.com/api/?name=Dr+Ahmed&background=0D8ABC&color=fff"
                                class="avatar-md" alt="Profile">
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container logout-container">

        <div class="logout-card">
            <div class="logout-icon-wrapper">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </div>

            <h4 class="fw-bold mb-2 text-dark">Log out</h4>
            <p class="text-muted mb-4">Are you sure you want to log out?</p>

            <div class="d-flex justify-content-between gap-3">
                <button onclick="history.back()" class="btn btn-primary-custom btn-wide">Cancel</button>
                <a href="../login.html" class="btn btn-danger-custom btn-wide text-decoration-none">Log out</a>
            </div>
        </div>

        <div class="text-center text-muted small mt-4">
            Need help? <a href="#" class="text-decoration-none">Contact support <i
                    class="fa-solid fa-chevron-right fa-xs"></i></a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
