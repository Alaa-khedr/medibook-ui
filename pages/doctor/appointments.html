<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments | MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <style>
        body {
            background-color: #EBF0F8;
            font-family: 'Inter', sans-serif;
        }

        .dashboard-header {
            background: #fff;
            padding: 15px 0;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03);
            margin-bottom: 40px;
        }

        .list-card {
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #EBF0F8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.3s;
            cursor: pointer;
            text-decoration: none;
        }

        .list-card:hover {
            border-color: #116FDE;
            background: #fdfdff;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(17, 111, 222, 0.1);
        }
    </style>
</head>

<body>

    <header class="dashboard-header sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="doctor-dashboard.html">
                <img src="/assets/images/logos/medibook-logo-transparent.png" alt="MediBook" height="40">
            </a>
            <div class="d-flex align-items-center gap-4">
                <i class="fa-solid fa-magnifying-glass text-secondary fs-5" style="cursor: pointer;"></i>
                <i class="fa-regular fa-bell text-secondary fs-4" style="cursor: pointer;"></i>
                <img src="https://randomuser.me/api/portraits/men/32.jpg" class="rounded-circle border" width="45"
                    height="45">
            </div>
        </div>
    </header>

    <div class="container pb-5">
        <h2 class="fw-bold mb-4" style="color: #153C79;">Appointments</h2>
        <div class="d-flex gap-3 mb-5">
            <button class="btn btn-primary rounded-pill px-5 py-2 fs-5 fw-medium">Upcoming</button>
            <button class="btn btn-light rounded-pill px-5 py-2 fs-5 text-muted border fw-medium">Past</button>
        </div>

        <div class="row g-4">
            <div class="col-12">
                <a href="appointment-details.html" class="list-card flex-column flex-md-row gap-3 text-start">
                    <div class="d-flex gap-4 align-items-center w-100">
                        <img src="https://randomuser.me/api/portraits/men/45.jpg" class="rounded-circle" width="80">
                        <div>
                            <h4 class="mb-1 fw-bold text-dark">Mohamed Abbas</h4>
                            <span class="text-muted fs-5 d-block mb-1">Tues, Apr 30 | 11:00 AM</span>
                            <span class="text-primary fw-bold fs-6"><i class="fa-solid fa-video me-1"></i> Online</span>
                        </div>
                    </div>
                    <div class="align-self-end align-self-md-center mt-2 mt-md-0">
                        <i class="fa-solid fa-chevron-right text-primary fs-3"></i>
                    </div>
                </a>
            </div>

            <div class="col-12">
                <a href="appointment-details.html" class="list-card flex-column flex-md-row gap-3 text-start">
                    <div class="d-flex gap-4 align-items-center w-100">
                        <img src="https://randomuser.me/api/portraits/women/44.jpg" class="rounded-circle" width="80">
                        <div>
                            <h4 class="mb-1 fw-bold text-dark">Sarah Khaled</h4>
                            <span class="text-muted fs-5 d-block mb-1">Tues, Apr 30 | 01:00 PM</span>
                            <span class="text-success fw-bold fs-6"><i class="fa-solid fa-location-dot me-1"></i> City
                                Medical Center</span>
                        </div>
                    </div>
                    <div class="align-self-end align-self-md-center mt-2 mt-md-0">
                        <i class="fa-solid fa-chevron-right text-primary fs-3"></i>
                    </div>
                </a>
            </div>

            <div class="col-12">
                <a href="appointment-details.html" class="list-card flex-column flex-md-row gap-3 text-start">
                    <div class="d-flex gap-4 align-items-center w-100">
                        <img src="https://randomuser.me/api/portraits/men/33.jpg" class="rounded-circle" width="80">
                        <div>
                            <h4 class="mb-1 fw-bold text-dark">Raouf Hussein</h4>
                            <span class="text-muted fs-5 d-block mb-1">Wed, May 1 | 09:00 AM</span>
                            <span class="text-primary fw-bold fs-6"><i class="fa-solid fa-video me-1"></i> Online</span>
                        </div>
                    </div>
                    <div class="align-self-end align-self-md-center mt-2 mt-md-0">
                        <i class="fa-solid fa-chevron-right text-primary fs-3"></i>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
