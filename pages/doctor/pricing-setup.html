<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <title>Pricing Setup</title>
</head>

<body>
    <!-- start pricing setup -->
    <section class="pricing-setup shadow">
        <div class="container">
            <div class="row">
                <h2>Pricing Setup</h2>
                <p class="pricing-setup-text">
                    Set your consultation fees
                </p>
                <div class="online-fees text-start">
                    <p class="online-fees-text">
                        <i class="fa-solid fa-computer"></i>
                        Online Consultation Fee
                    </p>
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="fee">EGP</span>
                        <input type="text" class="form-control" placeholder="" aria-label="online-fees"
                            aria-describedby="fee">
                    </div>
                </div>
                <div class="offline-fees text-start">
                    <p class="offline-fees-text ">
                        <i class="fa-solid fa-building"></i>
                        Offline Consultation Fee
                    </p>
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="fee">EGP</span>
                        <input type="text" class="form-control" placeholder="" aria-label="offline-fees"
                            aria-describedby="fee">
                    </div>
                </div>
                <button class="button save-button shadow mb-3 mt-3"
                    onclick="window.location.href='payment-info.html'">Save&Continue</button>
                <div class="need-help mb-3">
                    Need help?<a href="" class="support"> Contact Support ></a>
                </div>
            </div>
        </div>
    </section>
    <!-- end pricing setup -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
