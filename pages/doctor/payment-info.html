<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Info | MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <style>
        body {
            background-color: #EBF0F8;
            font-family: 'Inter', sans-serif;
        }

        .dashboard-header {
            background: #fff;
            padding: 15px 0;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03);
            margin-bottom: 40px;
        }

        .custom-card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid #EBF0F8;
            margin-bottom: 20px;
        }

        .custom-input {
            border: 1px solid #EBF0F8;
            border-radius: 10px;
            background-color: #FAFCFF;
            padding: 15px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <header class="dashboard-header sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="doctor-dashboard.html"><img src="/assets/images/logos/medibook-logo-transparent.png" alt="MediBook"
                    height="40"></a>
            <div class="d-flex align-items-center gap-4">
                <i class="fa-solid fa-magnifying-glass text-secondary fs-5"></i>
                <i class="fa-regular fa-bell text-secondary fs-4"></i>
                <a href="settings.html"><img src="https://randomuser.me/api/portraits/men/32.jpg"
                        class="rounded-circle border" width="45" height="45"></a>
            </div>
        </div>
    </header>

    <div class="container pb-5">
        <a href="doctor-dashboard.html" class="text-decoration-none text-muted mb-3 d-inline-block fs-5 fw-medium">
            <i class="fa-solid fa-chevron-left me-2"></i> Payment Info
        </a>
        <h2 class="fw-bold mb-2" style="color: #153C79;">Payment Info</h2>
        <p class="text-muted fs-5 mb-4 pb-2">Your bank account information.</p>

        <div class="custom-card">
            <div class="d-flex flex-column flex-md-row gap-4 align-items-md-center border-bottom pb-4 mb-4">
                <img src="https://randomuser.me/api/portraits/men/32.jpg"
                    class="rounded-circle border border-3 border-light shadow-sm" width="100">
                <div>
                    <h3 class="mb-2 fw-bold text-dark">Dr. Ahmed Samir</h3>
                    <span class="text-muted fs-5 d-block">+20 1012345678</span>
                    <span class="text-muted fs-5 d-block">dr.ahmed.samir@email.com</span>
                    <a href="profile-management.html" class="text-decoration-none d-inline-block mt-2 fw-medium"
                        style="color: #116FDE;">Change Profile Photo</a>
                </div>
            </div>

            <div class="mb-4">
                <div class="custom-input d-flex justify-content-between align-items-center mb-4 fw-medium text-dark">
                    <span><i class="fa-solid fa-building-columns text-primary me-2"></i> ABC Bank</span>
                    <i class="fa-solid fa-chevron-down text-muted"></i>
                </div>

                <label class="text-muted fw-medium mb-2 ms-1">IBAN</label>
                <input type="text" class="form-control custom-input mb-4"
                    value="EG-00-0000-0000-0000-0000-0000-0000-0000">

                <label class="text-muted fw-medium mb-2 ms-1">Account Holder</label>
                <input type="text" class="form-control custom-input mb-4" value="Dr. Ahmed Samir">

                <label class="text-muted fw-medium mb-2 ms-1">Clinic Information</label>
                <div class="custom-input d-flex justify-content-between align-items-start">
                    <div>
                        <span class="d-block text-dark fw-medium mb-1">City Medical Center</span>
                        <span class="text-muted small">123 Health St., Cairo, 11551</span>
                    </div>
                    <i class="fa-solid fa-chevron-down text-muted"></i>
                </div>
            </div>

            <button class="btn btn-primary w-100 py-3 fs-5 fw-bold shadow-sm" style="background: #116FDE;">Save
                Changes</button>
        </div>

        <div class="text-center mt-4">
            <span class="text-muted">Need help?</span> <a href="#" class="text-decoration-none fw-medium"
                style="color: #116FDE;">Contact support <i class="fa-solid fa-chevron-right ms-1"
                    style="font-size: 12px;"></i></a>
        </div>
    </div>
</body>

</html>
