<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBook | Payment Info</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary-custom" href="dashboard.html">
                <i class="fa-solid fa-book-medical fa-lg"></i> MediBook
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-3">
                    <li class="nav-item">
                        <a href="#" class="nav-link p-0">
                            <img src="https://ui-avatars.com/api/?name=Dr+Ahmed&background=0D8ABC&color=fff"
                                class="avatar-md" alt="Profile">
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 800px;">

        <div class="mb-4">
            <a href="dashboard.html" class="text-decoration-none text-muted mb-2 d-inline-block fw-medium">
                <i class="fa-solid fa-chevron-left fa-xs me-1"></i> Payment Info
            </a>
            <h4 class="fw-bold text-primary-custom">Payment Info</h4>
            <p class="text-muted">Your bank account information.</p>
        </div>

        <div class="custom-card mb-4">

            <div class="profile-header-section mb-4">
                <img src="https://ui-avatars.com/api/?name=Ahmed+Samir&background=random&size=200"
                    class="profile-img-xl" alt="Dr Profile">
                <div>
                    <h5 class="fw-bold mb-1">Dr. Ahmed Samir</h5>
                    <p class="text-muted mb-1 small">+20 1012345678</p>
                    <p class="text-muted mb-1 small">dr.ahmed.samir@email.com</p>
                    <a href="profile.html" class="change-photo-link">Change Profile Photo</a>
                </div>
            </div>

            <form>
                <div class="mb-3">
                    <label class="custom-form-label">Bank Name</label>
                    <div class="bank-select-wrapper">
                        <i class="fa-solid fa-building-columns bank-icon"></i>
                        <select class="form-select custom-select custom-select-with-icon">
                            <option selected>ABC Bank</option>
                            <option>CIB Bank</option>
                            <option>QNB Alahli</option>
                            <option>Banque Misr</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="custom-form-label">IBAN</label>
                    <input type="text" class="form-control custom-input" value="EG-00-0000-0000-0000-0000-0000-0000"
                        placeholder="Enter IBAN">
                </div>

                <div class="mb-3">
                    <label class="custom-form-label">Account Holder</label>
                    <select class="form-select custom-select">
                        <option selected>Dr. Ahmed Samir</option>
                        <option>Joint Account</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="custom-form-label">Clinic Information</label>
                    <div class="custom-input d-flex justify-content-between align-items-center"
                        style="background-color: #F3F4F6;">
                        <div>
                            <div class="fw-medium">City Medical Center</div>
                            <div class="text-muted small">123 Health St., Cairo, 11551</div>
                        </div>
                        <i class="fa-solid fa-chevron-down text-muted"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-3 fw-bold fs-5 shadow-sm">Save
                    Changes</button>
            </form>

        </div>

        <div class="text-center text-muted small mt-4 mb-3">
            Need help? <a href="#" class="text-decoration-none">Contact support <i
                    class="fa-solid fa-chevron-right fa-xs"></i></a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
