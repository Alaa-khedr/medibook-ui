<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/logos/medibook-logo-transparent.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/doctor.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
    <title>MediBook | Manage Availability</title>
</head>

<body>
    <div id="doctor-header-placeholder"></div>

    <div class="container pb-5">
        <a href="doctor-dashboard.html" class="text-decoration-none text-muted mb-3 d-inline-block fs-5 fw-medium">
            <i class="fa-solid fa-chevron-left me-2"></i> Availability
        </a>
        <h2 class="fw-bold mb-2" style="color: #153C79;">Manage Availability</h2>
        <p class="text-muted fs-5 mb-4 pb-2">Set your available days and time slots.</p>

        <div class="custom-card custom-card--availability border-start border-4 border-primary">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="day-title">Monday</span>
                <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                    <span class="badge bg-success">ON</span>
                    <input class="form-check-input m-0" type="checkbox" checked>
                </div>
            </div>
            <div class="doctor-time-slot">
                <span class="text-dark fw-medium fs-5">09:00 AM to 12:00 PM</span>
                <div class="d-flex gap-2">
                    <div class="action-icon"><i class="fa-solid fa-pen"></i></div>
                    <div class="action-icon delete"><i class="fa-regular fa-trash-can"></i></div>
                </div>
            </div>
            <div class="doctor-time-slot">
                <span class="text-dark fw-medium fs-5">02:00 PM to 05:00 PM</span>
                <a href="#" class="text-decoration-none fw-bold" style="color: #116FDE;"><i
                        class="fa-solid fa-plus me-1"></i> Add Time Slot</a>
            </div>
        </div>

        <div class="custom-card custom-card--availability opacity-50">
            <div class="d-flex justify-content-between align-items-center">
                <span class="day-title text-muted">Saturday</span>
                <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                    <span class="badge bg-secondary">OFF</span>
                    <input class="form-check-input m-0" type="checkbox">
                </div>
            </div>
        </div>

        <button class="btn btn-primary w-100 py-3 fs-5 fw-bold mt-4 shadow-sm" style="background: #116FDE;">Save
            Changes</button>
        <div class="text-center mt-4">
            <span class="text-muted">Need help?</span> <a href="#" class="text-decoration-none fw-medium"
                style="color: #116FDE;">Contact support <i class="fa-solid fa-chevron-right ms-1"
                    style="font-size: 12px;"></i></a>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/load-partials.js"></script>
</body>

</html>
