<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Availability | MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <style>
        body {
            background-color: #EBF0F8;
            font-family: 'Inter', sans-serif;
        }

        .dashboard-header {
            background: #fff;
            padding: 15px 0;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03);
            margin-bottom: 40px;
        }

        .custom-card {
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid #EBF0F8;
            margin-bottom: 20px;
        }

        .time-slot {
            background: #FAFCFF;
            border: 1px solid #EBF0F8;
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-icon {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #EBF0F8;
            color: #116FDE;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .action-icon:hover {
            background: #d1d9e9;
        }

        .action-icon.delete {
            color: #dc3545;
            background: #fce8e9;
        }

        .action-icon.delete:hover {
            background: #f8d7da;
        }

        .form-switch .form-check-input {
            width: 3em;
            height: 1.5em;
            cursor: pointer;
        }

        .form-switch .form-check-input:checked {
            background-color: #2E7D32;
            border-color: #2E7D32;
        }

        .day-title {
            color: #153C79;
            font-weight: 600;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <header class="dashboard-header sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="doctor-dashboard.html"><img src="/assets/images/logos/medibook-logo-transparent.png" alt="MediBook"
                    height="40"></a>
            <div class="d-flex align-items-center gap-4">
                <i class="fa-solid fa-magnifying-glass text-secondary fs-5" style="cursor: pointer;"></i>
                <i class="fa-regular fa-bell text-secondary fs-4" style="cursor: pointer;"></i>
                <a href="settings.html"><img src="https://randomuser.me/api/portraits/men/32.jpg"
                        class="rounded-circle border" width="45" height="45"></a>
            </div>
        </div>
    </header>

    <div class="container pb-5">
        <a href="doctor-dashboard.html" class="text-decoration-none text-muted mb-3 d-inline-block fs-5 fw-medium">
            <i class="fa-solid fa-chevron-left me-2"></i> Availability
        </a>
        <h2 class="fw-bold mb-2" style="color: #153C79;">Manage Availability</h2>
        <p class="text-muted fs-5 mb-4 pb-2">Set your available days and time slots.</p>

        <div class="custom-card border-start border-4 border-primary">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="day-title">Monday</span>
                <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                    <span class="badge bg-success">ON</span>
                    <input class="form-check-input m-0" type="checkbox" checked>
                </div>
            </div>
            <div class="time-slot">
                <span class="text-dark fw-medium fs-5">09:00 AM to 12:00 PM</span>
                <div class="d-flex gap-2">
                    <div class="action-icon"><i class="fa-solid fa-pen"></i></div>
                    <div class="action-icon delete"><i class="fa-regular fa-trash-can"></i></div>
                </div>
            </div>
            <div class="time-slot">
                <span class="text-dark fw-medium fs-5">02:00 PM to 05:00 PM</span>
                <a href="#" class="text-decoration-none fw-bold" style="color: #116FDE;"><i
                        class="fa-solid fa-plus me-1"></i> Add Time Slot</a>
            </div>
        </div>

        <div class="custom-card opacity-50">
            <div class="d-flex justify-content-between align-items-center">
                <span class="day-title text-muted">Saturday</span>
                <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                    <span class="badge bg-secondary">OFF</span>
                    <input class="form-check-input m-0" type="checkbox">
                </div>
            </div>
        </div>

        <button class="btn btn-primary w-100 py-3 fs-5 fw-bold mt-4 shadow-sm" style="background: #116FDE;">Save
            Changes</button>
        <div class="text-center mt-4">
            <span class="text-muted">Need help?</span> <a href="#" class="text-decoration-none fw-medium"
                style="color: #116FDE;">Contact support <i class="fa-solid fa-chevron-right ms-1"
                    style="font-size: 12px;"></i></a>
        </div>
    </div>
</body>

</html>
