<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/logos/medibook-logo-transparent.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/doctor.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
    <title>MediBook | Appointment Details</title>
</head>

<body>

    <div id="doctor-header-placeholder"></div>

    <div class="container pb-5">
        <a href="appointments.html" class="text-decoration-none text-muted mb-4 d-inline-block fs-5 fw-medium">
            <i class="fa-solid fa-chevron-left me-2"></i> Back to Appointments
        </a>
        <h2 class="fw-bold mb-4 pb-2" style="color: #153C79;">Appointment Details</h2>

        <div class="custom-card custom-card--details">
            <div class="d-flex flex-column flex-md-row gap-4 align-items-md-center mb-5 pb-4 border-bottom">
                <img src="https://randomuser.me/api/portraits/men/45.jpg"
                    class="rounded-circle border border-3 border-light shadow-sm" width="100">
                <div>
                    <h3 class="mb-2 fw-bold text-dark">Mohamed Abbas</h3>
                    <span class="text-muted fs-5 d-block mb-1"><i class="fa-solid fa-phone me-2 text-primary"></i> +20
                        1012345678</span>
                    <span class="text-muted fs-5 d-block"><i class="fa-solid fa-envelope me-2 text-primary"></i>
                        mohamed.abbas@email.com</span>
                </div>
            </div>

            <p class="text-muted fw-bold mb-2 fs-5">Consultation Type</p>
            <div class="info-box fw-bold text-dark d-flex align-items-center">
                <i class="fa-solid fa-video text-primary fs-4 me-3"></i> Online Video Call
            </div>

            <p class="text-muted fw-bold mb-2 mt-4 fs-5">Date & Time</p>
            <div class="info-box d-flex flex-column flex-lg-row justify-content-between align-items-lg-center">
                <div class="fw-bold text-dark mb-2 mb-lg-0 d-flex align-items-center">
                    <i class="fa-regular fa-calendar text-primary fs-4 me-3"></i> Tuesday, April 30, 2024 | 11:00 AM
                </div>
                <span class="text-muted fs-6 bg-light p-2 rounded">Booked on: April 28, 2024 at 2:15 PM</span>
            </div>

            <p class="text-muted fw-bold mb-2 mt-4 fs-5">Current Status</p>
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center mt-3 gap-4">
                <div class="bg-success bg-opacity-10 px-4 py-2 rounded-pill">
                    <span class="text-success fw-bold fs-5 d-flex align-items-center gap-2">
                        <span class="status-dot"></span> Upcoming Appointment
                    </span>
                </div>
                <div class="d-flex gap-3 w-100 w-lg-auto flex-column flex-sm-row">
                    <button class="btn btn-primary px-5 py-3 fs-5 fw-bold w-100 w-sm-auto shadow-sm"><i
                            class="fa-solid fa-video me-2"></i> Start Call</button>
                    <button class="btn btn-light border px-5 py-3 fs-5 fw-bold text-muted w-100 w-sm-auto">Record
                        Notes</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/load-partials.js"></script>
</body>

</html>
