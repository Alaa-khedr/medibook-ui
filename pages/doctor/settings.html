<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/logos/medibook-logo-transparent.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/doctor.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
    <title>MediBook | Settings</title>
</head>

<body>
    <div id="doctor-header-placeholder"></div>

    <div class="container pb-5">
        <a href="doctor-dashboard.html" class="text-decoration-none text-muted mb-3 d-inline-block fs-5 fw-medium">
            <i class="fa-solid fa-chevron-left me-2"></i> Account
        </a>
        <h2 class="fw-bold mb-2" style="color: #153C79;">Settings</h2>
        <p class="text-muted fs-5 mb-4 pb-2">Manage your account settings.</p>

        <div class="custom-card custom-card--settings">
            <a href="#" class="text-decoration-none text-dark setting-row">
                <div>
                    <h5 class="fw-medium mb-1"><i class="fa-solid fa-lock text-primary me-2 px-1"></i> Change Password
                    </h5>
                    <span class="text-muted fs-6 ms-4 ps-2">Update your password</span>
                </div>
                <i class="fa-solid fa-chevron-right text-muted"></i>
            </a>

            <div class="setting-row">
                <div>
                    <h5 class="fw-medium mb-1"><i class="fa-solid fa-bell text-primary me-2"></i> Notifications</h5>
                    <span class="text-muted fs-6 ms-4 ps-2">Manage your notification preferences</span>
                </div>
                <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                    <span class="badge bg-success">ON</span>
                    <input class="form-check-input m-0" type="checkbox" checked>
                </div>
            </div>

            <a href="logout.html" class="text-decoration-none text-danger setting-row border-top">
                <div>
                    <h5 class="fw-medium mb-1"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Log Out</h5>
                </div>
                <i class="fa-solid fa-chevron-right text-muted"></i>
            </a>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/load-partials.js"></script>
</body>

</html>
