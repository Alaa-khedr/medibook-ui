<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | MediBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <style>
        body {
            background-color: #EBF0F8;
            font-family: 'Inter', sans-serif;
        }

        .dashboard-header {
            background: #fff;
            padding: 15px 0;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.03);
            margin-bottom: 40px;
        }

        .custom-card {
            background: #fff;
            border-radius: 16px;
            padding: 10px 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid #EBF0F8;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            border-bottom: 1px solid #EBF0F8;
        }

        .setting-row:last-child {
            border-bottom: none;
        }

        .form-switch .form-check-input {
            width: 3em;
            height: 1.5em;
            cursor: pointer;
        }

        .form-switch .form-check-input:checked {
            background-color: #2E7D32;
            border-color: #2E7D32;
        }
    </style>
</head>

<body>
    <header class="dashboard-header sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="doctor-dashboard.html"><img src="/assets/images/logos/medibook-logo-transparent.png" alt="MediBook"
                    height="40"></a>
            <div class="d-flex align-items-center gap-4">
                <i class="fa-solid fa-magnifying-glass text-secondary fs-5"></i>
                <i class="fa-regular fa-bell text-secondary fs-4"></i>
                <a href="settings.html"><img src="https://randomuser.me/api/portraits/men/32.jpg"
                        class="rounded-circle border" width="45" height="45"></a>
            </div>
        </div>
    </header>

    <div class="container pb-5">
        <a href="doctor-dashboard.html" class="text-decoration-none text-muted mb-3 d-inline-block fs-5 fw-medium">
            <i class="fa-solid fa-chevron-left me-2"></i> Account
        </a>
        <h2 class="fw-bold mb-2" style="color: #153C79;">Settings</h2>
        <p class="text-muted fs-5 mb-4 pb-2">Manage your account settings.</p>

        <div class="custom-card">
            <a href="#" class="text-decoration-none text-dark setting-row">
                <div>
                    <h5 class="fw-medium mb-1"><i class="fa-solid fa-lock text-primary me-2 px-1"></i> Change Password
                    </h5>
                    <span class="text-muted fs-6 ms-4 ps-2">Update your password</span>
                </div>
                <i class="fa-solid fa-chevron-right text-muted"></i>
            </a>

            <div class="setting-row">
                <div>
                    <h5 class="fw-medium mb-1"><i class="fa-solid fa-bell text-primary me-2"></i> Notifications</h5>
                    <span class="text-muted fs-6 ms-4 ps-2">Manage your notification preferences</span>
                </div>
                <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                    <span class="badge bg-success">ON</span>
                    <input class="form-check-input m-0" type="checkbox" checked>
                </div>
            </div>

            <a href="logout.html" class="text-decoration-none text-danger setting-row border-top">
                <div>
                    <h5 class="fw-medium mb-1"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Log Out</h5>
                </div>
                <i class="fa-solid fa-chevron-right text-muted"></i>
            </a>
        </div>
    </div>
</body>

</html>
