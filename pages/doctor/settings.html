<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBook | Settings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary-custom" href="dashboard.html">
                <i class="fa-solid fa-book-medical fa-lg"></i> MediBook
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-3">
                    <li class="nav-item">
                        <a href="#" class="nav-link p-0">
                            <img src="https://ui-avatars.com/api/?name=Dr+Ahmed&background=0D8ABC&color=fff"
                                class="avatar-md" alt="Profile">
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 800px;">

        <div class="mb-4">
            <a href="dashboard.html" class="text-decoration-none text-muted mb-2 d-inline-block fw-medium">
                <i class="fa-solid fa-chevron-left fa-xs me-1"></i> Account
            </a>
            <h4 class="fw-bold text-primary-custom">Settings</h4>
            <p class="text-muted">Manage your account settings.</p>
        </div>

        <div class="settings-card shadow-sm">

            <a href="#" class="settings-item">
                <div class="d-flex align-items-center gap-3">
                    <div class="settings-icon-box">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-1 text-dark">Change Password</h6>
                        <p class="text-muted small mb-0">Update your password</p>
                    </div>
                </div>
                <div>
                    <i class="fa-solid fa-chevron-right text-muted"></i>
                </div>
            </a>

            <div class="settings-item">
                <div class="d-flex align-items-center gap-3">
                    <div class="settings-icon-box">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-1 text-dark">Notifications</h6>
                        <p class="text-muted small mb-0">Manage your notification preferences</p>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="toggle-label on">ON</span>
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input custom-toggle" type="checkbox" role="switch" checked>
                    </div>
                </div>
            </div>

        </div>

        <div class="text-center text-muted small mt-4">
            Need help? <a href="#" class="text-decoration-none">Contact support</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
