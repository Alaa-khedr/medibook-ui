<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <title>Availability setup</title>
</head>

<body>
    <!-- start availability setup -->
    <section class="availability-setup shadow">
        <div class="container">
            <div class="row">
                <h2>Availability Setup</h2>
                <div class="visit-type">
                    <div class="online active">
                        <i class="fa-solid fa-computer"></i>
                        <span>
                            Online
                        </span>
                    </div>
                    <div class="offline ">
                        <i class="fa-solid fa-building"></i>
                        <span>
                            Offline
                        </span>
                    </div>
                </div>
                <p class="availability-text">Set your available days and time slots.</p>
                <div class="days">
                    <input type="checkbox" class="btn-check" id="sat" autocomplete="off">
                    <label class="btn btn-outline-primary" for="sat">Sat</label>

                    <input type="checkbox" class="btn-check" id="sun" autocomplete="off">
                    <label class="btn btn-outline-primary" for="sun">Sun</label>

                    <input type="checkbox" class="btn-check" id="mon" autocomplete="off">
                    <label class="btn btn-outline-primary" for="mon">Mon</label>

                    <input type="checkbox" class="btn-check" id="tue" autocomplete="off">
                    <label class="btn btn-outline-primary" for="tue">Tue</label>

                    <input type="checkbox" class="btn-check" id="wed" autocomplete="off">
                    <label class="btn btn-outline-primary" for="wed">Wed</label>

                    <input type="checkbox" class="btn-check" id="thu" autocomplete="off">
                    <label class="btn btn-outline-primary" for="thu">Thu</label>

                    <input type="checkbox" class="btn-check" id="fri" autocomplete="off">
                    <label class="btn btn-outline-primary" for="fri">Fri</label>
                </div>
                <div class="add-time d-flex justify-content-center align-items-center gap-2 m-3">
                    <i class="fa-solid fa-plus"></i>
                    <p class="availability-text m-0">Add Time Slot</p>
                </div>
                <!-- <div class="time m-5">
                    <div class="time-text">09:00 AM to 09:30 AM</div>
                    <div class="edit-time">
                        <i class="fa-solid fa-pencil"></i>
                    </div>
                    <div class="delete-time">
                        <i class="fa-solid fa-trash"></i>
                    </div>
                </div> -->
                <div class="time-slot-container d-flex align-items-center justify-content-between p-3 mb-3">
                    <div class="time-text">
                        <span class="time-value">09:00 <span class="ampm">AM</span></span>
                        <span class="to-text mx-2">to</span>
                        <span class="time-value">12:00 <span class="ampm">PM</span></span>
                    </div>

                    <div class="actions d-flex gap-2">
                        <div class="edit-time action-icon">
                            <i class="fa-solid fa-pencil"></i>
                        </div>
                        <div class="delete-time action-icon delete">
                            <i class="fa-solid fa-trash"></i>
                        </div>
                    </div>
                </div>
                <button class="button save-button shadow mb-3"
                    onclick="window.location.href='pricing-setup.html'">Save&Continue</button>
                <div class="need-help mb-3">
                    Need help?<a href="" class="support"> Contact Support ></a>
                </div>
            </div>
        </div>
    </section>
    <!-- end availability setup -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
