<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/logos/medibook-logo-transparent.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/doctor.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
    <title>MediBook | Doctor Signup</title>
</head>

<body>
    <!--Start doctor-signup-->
    <section class="doctor-signup__form shadow">
        <div class="container">
            <div class="row">
                <div class="doctor-image">
                    <img src="/assets/images/doctor/doctor.svg" alt="doctor image">
                </div>
                <h2>Doctor Signup</h2>
                <div class="breaker"></div>

                <form>

                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon1"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" placeholder="Full Name" aria-label="Username"
                            aria-describedby="basic-addon1" name="full-name" required>
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon2"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control" placeholder="Email Address" aria-label="Email Address"
                            aria-describedby="basic-addon2" name="email" required>
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon3"><i class="fa-solid fa-phone"></i></span>
                        <input type="tel" class="form-control" placeholder="Phone Number" aria-label="Phone Number"
                            aria-describedby="basic-addon3" name="phone" required>
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text" id="basic-addon4"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" placeholder="Password" aria-label="Password"
                            aria-describedby="basic-addon4" name="password" required>
                    </div>

                    <button class="button doctor-signup-create-account shadow"
                        onclick="window.location.href='doctor-profile-setup.html'">Create Account</button>
                </form>

                <div class="breaker"></div>
                <p class="have-account">
                    Already have an account?
                    <a href="#login">Login</a>
                </p>
            </div>
        </div>
    </section>

    <!--end doctor-signup-->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/load-partials.js"></script>
</body>

</html>
