<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/logos/medibook-logo-transparent.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/doctor.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
    <title>MediBook | Consultation Setup</title>
</head>

<body>
    <!-- start Consultation setup -->
    <div class="consultation-setup shadow">
        <div class="container">
            <div class="row">
                <h2>Consultation Setup Type</h2>
                <p class="choose mt-3 mb-3">choose the types of consultaions you will offer: </p>
                <div class="consultations-types mb-3">
                    <div class="type">
                        <i class="fa-solid fa-computer"></i>
                        <p class="type-text">Online</p>
                    </div>
                    <div class="type">
                        <i class="fa-solid fa-building"></i>
                        <p class="type-text">Offline</p>
                    </div>
                    <div class="type active">
                        <i class="fa-solid fa-computer"></i>
                        <i class="fa-solid fa-plus"></i>
                        <i class="fa-solid fa-building"></i>
                        <p class="type-text">Both</p>
                    </div>
                </div>
                <button class="button save-button shadow mb-3"
                    onclick="window.location.href='availability-setup.html'">Save&Continue</button>
                <div class="need-help mb-3">
                    Need help?<a href="" class="support"> Contact Support ></a>
                </div>
            </div>
        </div>
    </div>
    <!-- end Consultation setup -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/load-partials.js"></script>
</body>

</html>
