<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/logos/medibook-logo-transparent.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/doctor.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
    <title>MediBook | Profile Setup</title>
</head>

<body>

    <!-- start doctor profile setup -->
    <section class="doctor-profile__setup shadow">
        <div class="container">
            <div class="row">
                <h2>Doctor Profile Setup</h2>
                <div class="doctor-image mb-3">
                    <img src="/assets/images/doctor/doctor.svg" alt="doctor image">
                    <div class="upload-image mb-3">
                        <label for="upload-image" class="upload-btn">
                            <i class="fa-solid fa-camera"></i>
                            <span>Upload Photo</span>
                        </label>
                        <input type="file" name="upload-image" id="upload-image" hidden required>
                    </div>
                </div>
                <div class="input-group mb-3">
                    <label class="input-group-text" for="speciality">
                        <i class="fa-solid fa-stethoscope"></i>
                    </label>
                    <select class="form-select" id="speciality" required>
                        <option selected disabled>Speciality</option>
                        <option value="general">General Practitioner - طبيب عام</option>
                        <option value="cardiology">Cardiology - قلب</option>
                        <option value="dermatology">Dermatology - جلدية</option>
                        <option value="pediatrics">Pediatrics - أطفال</option>
                        <option value="orthopedics">Orthopedics - عظام</option>
                        <option value="neurology">Neurology - مخ وأعصاب</option>
                        <option value="psychiatry">Psychiatry - نفسي</option>
                        <option value="ent">ENT - أنف وأذن وحنجرة</option>
                        <option value="ophthalmology">Ophthalmology - عيون</option>
                        <option value="dentistry">Dentistry - أسنان</option>
                        <option value="urology">Urology - مسالك بولية</option>
                        <option value="gynecology">Gynecology - نساء وتوليد</option>
                        <option value="andrology">Andrology - ذكورة</option>
                        <option value="gastroenterology">Gastroenterology - جهاز هضمي</option>
                        <option value="pulmonology">Pulmonology - صدر</option>
                        <option value="endocrinology">Endocrinology - غدد صماء</option>
                        <option value="nephrology">Nephrology - كلى</option>
                        <option value="rheumatology">Rheumatology - روماتيزم</option>
                        <option value="oncology">Oncology - أورام</option>
                        <option value="hematology">Hematology - أمراض دم</option>
                        <option value="infectious">Infectious Diseases - أمراض معدية</option>
                        <option value="general-surgery">General Surgery - جراحة عامة</option>
                        <option value="vascular-surgery">Vascular Surgery - جراحة أوعية دموية</option>
                        <option value="neurosurgery">Neurosurgery - جراحة مخ وأعصاب</option>
                        <option value="cardiothoracic">Cardiothoracic Surgery - جراحة قلب وصدر</option>
                        <option value="nutrition">Clinical Nutrition - تغذية علاجية</option>
                        <option value="physiotherapy">Physiotherapy - علاج طبيعي</option>
                    </select>
                </div>
                <div class="short-bio mb-3">
                    <p class="short-bio-text text-start">Short Bio</p>
                    <label for="short-bio"></label>
                    <textarea name="short-bio" id="short-bio"
                        placeholder="Tell us a bit aout yourself and your medical experiance"></textarea>
                </div>
                <div class="clinic">
                    <p class="clinic-text text-start mb-3">Clinic Name <span class="optinal">(Optional)</span></p>
                    <div class="input-group mb-3">
                        <span class="input-group-text" id="clinic"><i class="fa-solid fa-building"></i></span>
                        <input type="text" class="form-control" placeholder="Enter your clinic name" aria-label="clinic"
                            aria-describedby="clinic">
                    </div>
                </div>
                <button class="button save-button shadow mb-3"
                    onclick="window.location.href='consultation-setup.html'">Save&Continue</button>
                <div class="need-help mb-3">
                    Need help?<a href="" class="support"> Contact Support ></a>
                </div>
            </div>
        </div>
    </section>
    <!-- end doctor profile setup -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/load-partials.js"></script>
</body>

</html>
