<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" href="/assets/images/logos/medibook-logo-transparent.png" type="image/png">

    <title>MediBook | Appointments</title>

<body>

    <div id="doctor-header-placeholder"></div>

    <div class="container pb-5">
        <h2 class="fw-bold mb-4" style="color: #153C79;">Appointments</h2>
        <div class="d-flex gap-3 mb-5">
            <button class="btn btn-primary rounded-pill px-5 py-2 fs-5 fw-medium">Upcoming</button>
            <button class="btn btn-light rounded-pill px-5 py-2 fs-5 text-muted border fw-medium">Past</button>
        </div>

        <div class="row g-4">
            <div class="col-12">
                <a href="appointment-details.html" class="list-card flex-column flex-md-row gap-3 text-start">
                    <div class="d-flex gap-4 align-items-center w-100">
                        <img src="https://randomuser.me/api/portraits/men/45.jpg" class="rounded-circle" width="80">
                        <div>
                            <h4 class="mb-1 fw-bold text-dark">Mohamed Abbas</h4>
                            <span class="text-muted fs-5 d-block mb-1">Tues, Apr 30 | 11:00 AM</span>
                            <span class="text-primary fw-bold fs-6"><i class="fa-solid fa-video me-1"></i> Online</span>
                        </div>
                    </div>
                    <div class="align-self-end align-self-md-center mt-2 mt-md-0">
                        <i class="fa-solid fa-chevron-right text-primary fs-3"></i>
                    </div>
                </a>
            </div>

            <div class="col-12">
                <a href="appointment-details.html" class="list-card flex-column flex-md-row gap-3 text-start">
                    <div class="d-flex gap-4 align-items-center w-100">
                        <img src="https://randomuser.me/api/portraits/women/44.jpg" class="rounded-circle" width="80">
                        <div>
                            <h4 class="mb-1 fw-bold text-dark">Sarah Khaled</h4>
                            <span class="text-muted fs-5 d-block mb-1">Tues, Apr 30 | 01:00 PM</span>
                            <span class="text-success fw-bold fs-6"><i class="fa-solid fa-location-dot me-1"></i> City
                                Medical Center</span>
                        </div>
                    </div>
                    <div class="align-self-end align-self-md-center mt-2 mt-md-0">
                        <i class="fa-solid fa-chevron-right text-primary fs-3"></i>
                    </div>
                </a>
            </div>

            <div class="col-12">
                <a href="appointment-details.html" class="list-card flex-column flex-md-row gap-3 text-start">
                    <div class="d-flex gap-4 align-items-center w-100">
                        <img src="https://randomuser.me/api/portraits/men/33.jpg" class="rounded-circle" width="80">
                        <div>
                            <h4 class="mb-1 fw-bold text-dark">Raouf Hussein</h4>
                            <span class="text-muted fs-5 d-block mb-1">Wed, May 1 | 09:00 AM</span>
                            <span class="text-primary fw-bold fs-6"><i class="fa-solid fa-video me-1"></i> Online</span>
                        </div>
                    </div>
                    <div class="align-self-end align-self-md-center mt-2 mt-md-0">
                        <i class="fa-solid fa-chevron-right text-primary fs-3"></i>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/load-partials.js"></script>
