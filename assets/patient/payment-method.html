<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/logos/medibook-logo-transparent.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/patient.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
    <title>MediBook | Payment Method</title>
</head>

<body>
    <div id="navbar-placeholder"></div>

    <main class="payment-page container">
        <div class="row">
            <div class="col-12">
                <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb" class="mt-4 mb-5">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="patient-home.html" class="results-page-link-item text-muted">Home</a></li>
                        <li class="breadcrumb-item"><a href="doctor-profile.html" class="results-page-link-item text-muted">Doctor Profile</a></li>
                        <li class="breadcrumb-item"><a href="booking-summary.html" class="results-page-link-item text-muted">Booking Summary</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Payment Method</li>
                    </ol>
                </nav>

                <h2 class="payment-page-title main-text text-center mb-4">Select Payment Method</h2>

                <section class="payment-container">
                    <div class="payment-note mb-3">
                        <p class="payment-note-text text-center mb-0">Create an account to easily view and manage your appointments later.</p>
                    </div>

                    <div class="payment-card shadow">
                        <form action="" class="payment-form">
                            <label class="payment-option shadow-sm">
                                <div class="payment-option-content">
                                    <div class="payment-option-icon">
                                        <img src="/assets/images/patient/credit-card.svg" alt="Credit Card" class="online-payment-icon">
                                    </div>
                                    <div class="payment-option-info">
                                        <h4 class="payment-option-title main-text">Online Payment</h4>
                                        <p class="payment-option-subtitle mb-0">Pay securely online</p>
                                    </div>
                                </div>
                                <input type="radio" name="method" checked class="payment-option-input">
                                <div class="payment-option-custom-radio">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                            </label>

                            <label class="payment-option shadow-sm">
                                <div class="payment-option-content">
                                    <div class="payment-option-icon">
                                        <img src="/assets/images/patient/dollars.svg" alt="Cash" class="offline-payment-icon">
                                    </div>
                                    <div class="payment-option-info">
                                        <h4 class="payment-option-title main-text">Cash</h4>
                                        <p class="payment-option-subtitle mb-0">(Offline Only)</p>
                                    </div>
                                </div>
                                <input type="radio" name="method" class="payment-option-input">
                                <div class="payment-option-custom-radio">
                                    <i class="far fa-circle"></i>
                                </div>
                            </label>

                            <a href="online-payment.html" class="payment-form-submit patient-btn patient-btn--primary w-100 shadow-sm">Continue</a>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/load-partials.js"></script>
</body>

</html>
